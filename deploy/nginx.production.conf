server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Server-to-server callbacks use the private Docker network, never the public edge.
    location ^~ /api/internal/ { return 404; }
    location = /api/internal { return 404; }
    location ^~ /api/actuator/ { return 404; }
    location = /api/actuator { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5 MiB documents are encoded as a bounded JSON payload; other API routes keep their existing limits.
    location = /api/local-workspace/document/extract {
        client_max_body_size 8m;
        proxy_pass http://backend:8080/api/local-workspace/document/extract;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 40s;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
